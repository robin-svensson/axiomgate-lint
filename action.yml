name: 'AxiomGate AI Agent Linter'
description: 'Deterministic AST security & privilege linter for multi-agent systems'
author: 'Robin Svensson'
inputs:
  target-path:
    description: 'Path to scan for agent architectures'
    required: false
    default: '.'
  fail-on:
    description: 'Severity threshold to trigger exit failure (critical, high, medium, low, any)'
    required: false
    default: 'high'
  format:
    description: 'Output format (text, json, github)'
    required: false
    default: 'github'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'
    - name: Install AxiomGate Linter
      shell: bash
      # github.action_path, not "." — inside a composite action the working
      # directory is the *consumer's* checkout, so `pip install .` installed
      # whatever project was being scanned rather than the linter, and the
      # action failed for everyone who used it.
      run: python3 -m pip install --disable-pip-version-check "${{ github.action_path }}"

    - name: Run AxiomGate Linter
      shell: bash
      run: |
        axiomgate-lint "${{ inputs.target-path }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --format "${{ inputs.format }}"
branding:
  icon: 'shield'
  color: 'blue'
