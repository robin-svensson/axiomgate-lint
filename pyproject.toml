[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomgate-lint"
dynamic = ["version"]
authors = [
  { name="Robin Svensson", email="228113985+robin-svensson@users.noreply.github.com" },
]
description = "Deterministic AST security and privilege linter for CrewAI multi-agent systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
axiomgate-lint = "axiomgate_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "axiomgate_lint.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A parametrised test whose parameter set comes out empty is skipped by
# default, and a skip reads as green. That cost the kernel repository 48 tests
# without a red run 2026-09-11; nothing here parametrises over discovered files
# today, and this makes sure that stays a deliberate choice rather than a
# silent one.
empty_parameter_set_mark = "fail_at_collect"

[project.urls]
Homepage = "https://github.com/robin-svensson/axiomgate-lint"
Repository = "https://github.com/robin-svensson/axiomgate-lint"
Issues = "https://github.com/robin-svensson/axiomgate-lint/issues"
