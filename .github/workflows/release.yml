name: Release to PyPI

# Publishes on a version tag, never on a branch push. The tag is the decision;
# everything before this point is reversible and everything after it is not --
# PyPI does not allow a version number to be reused, even after a deletion.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # The tag does not get to skip the checks. A release that fails its own suite
  # is worse than a late one, and by the time the tag is pushed it is too late
  # to find out.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - run: pip install -e ".[dev]"
    - run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Build
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*
    - name: The tag must match the version being published
      # Otherwise `git tag v0.3.0` on a tree that still says 0.2.1 publishes
      # 0.2.1 again -- which PyPI rejects as a duplicate, after the tag is
      # already public. This repository has had a tag disagree with its version
      # before: v0.2.2 was tagged on the v0.2.1 tree and had to be deleted.
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        WHEEL_VERSION="$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3.*/\1/')"
        echo "tag=$TAG wheel=$WHEEL_VERSION"
        if [ "$TAG" != "$WHEEL_VERSION" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match built version $WHEEL_VERSION" >&2
          exit 1
        fi
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this workflow's OIDC identity directly,
    # so there is no API token to store, leak or rotate. It is bound to this
    # repository, this workflow file and this environment on PyPI's side.
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
